name: mangaflow-acceptance

# Isolated data services dedicated to Phase 2 automated integration acceptance.
# Ports are bound exclusively to loopback (127.0.0.1) on dedicated non-default ports
# (PostgreSQL: 55432, Redis: 56379) with independent named volumes and credentials.
# Strictly isolated from standard development (5432/6379) and production environments.

services:
  acceptance-postgres:
    image: postgres:16-alpine
    container_name: mangaflow-acceptance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mangaflow_acceptance}
      POSTGRES_USER: ${POSTGRES_USER:-mangaflow_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mangaflow_test_pass}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mangaflow-acceptance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangaflow_test -d mangaflow_acceptance"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"

  acceptance-redis:
    image: redis:7-alpine
    container_name: mangaflow-acceptance-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mangaflow_redis_test_pass}
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--requirepass",
        "${REDIS_PASSWORD:-mangaflow_redis_test_pass}",
      ]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - mangaflow-acceptance-redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"

volumes:
  mangaflow-acceptance-postgres-data:
  mangaflow-acceptance-redis-data: