[package]
name = "mangaflow-desktop-shell-core"
version = "0.1.0"
edition = "2021"
description = "MangaFlow desktop shell core: sidecar handshake + process-tree ownership (no GUI deps)"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
