[package]
name = "mangaflow-desktop-shell"
version = "0.1.0"
edition = "2021"
description = "MangaFlow Tauri 2 desktop shell (V02-54 delivery)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mangaflow-desktop-shell-core = { path = "../shell-core" }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[features]
default = []
