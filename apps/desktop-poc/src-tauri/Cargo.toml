[package]
name = "mangaflow-poc-shell"
version = "0.1.0"
edition = "2021"
description = "V02-53B disposable Tauri 2 desktop shell PoC for MangaFlow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mangaflow-poc-shell-core = { path = "../shell-core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[features]
default = []
