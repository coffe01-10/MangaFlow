<svg xmlns="http://www.w3.org/2000/svg" width="430" height="904" viewBox="0 0 430 904" role="img" aria-label="MangaFlow 漫画创作流程概览">
<title>MangaFlow 漫画创作流程概览</title>
<desc>原文与人物服装风格设定，进入剧本分页和分镜，再逐页生成一个候选；人工校对采用和视觉检查后输出。数据保存在本地，AI 调用使用外部供应商。这是业务流程示意，不是运行截图；任务可靠性、保存与质检仍有待修复问题。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style><defs><pattern id="paper-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.6" fill="#c9c2b3"/></pattern></defs><rect x="1" y="1" width="428" height="902" fill="#f4f1e9" stroke="#d7d1c4" stroke-width="1.5"/><rect x="2" y="2" width="426" height="900" fill="url(#paper-dots)"/><text x="24" y="36" font-size="12" fill="#66604f" font-weight="700" text-anchor="start">MANGAFLOW / PRODUCTION MAP</text><text x="24" y="80" font-size="27" fill="#151512" font-weight="700" text-anchor="start">一段原文，一页漫画。</text><text x="24" y="112" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">流程示意 · 非界面截图</text><rect x="28" y="147" width="382" height="128" fill="#ded7c9"/><rect x="24" y="142" width="382" height="128" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="24" y="142" width="382" height="4" fill="#151512"/><text x="40" y="176" font-size="22" fill="#151512" font-weight="700" text-anchor="start">01</text><text x="92" y="177" font-size="24" fill="#151512" font-weight="700" text-anchor="start">原文与设定</text><text x="92" y="210" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">原作导入与来源追溯</text><text x="92" y="237" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">人物 / 服装 / 风格</text><g transform="translate(39,191) scale(.5)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><path d="M16 22H57 M16 34H57 M16 46H48 M16 58H54" fill="none" stroke="#66604f" stroke-width="3"/><rect x="49" y="66" width="14" height="8" fill="#151512"/></g><path d="M215 276v11m-5-5 5 5 5-5" fill="none" stroke="#b23c25" stroke-width="2"/><rect x="28" y="297" width="382" height="128" fill="#ded7c9"/><rect x="24" y="292" width="382" height="128" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="24" y="292" width="382" height="4" fill="#47745a"/><text x="40" y="326" font-size="22" fill="#47745a" font-weight="700" text-anchor="start">02</text><text x="92" y="327" font-size="24" fill="#151512" font-weight="700" text-anchor="start">剧本与分镜</text><text x="92" y="360" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">解析 / 分页 / 格位</text><text x="92" y="387" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">确认当前分镜版本</text><g transform="translate(39,341) scale(.5)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><rect x="12" y="13" width="25" height="25" fill="#47745a"/><rect x="43" y="13" width="19" height="25" fill="#ebe6da" stroke="#151512" stroke-width="1.5"/><rect x="12" y="45" width="50" height="28" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><path d="M17 66L30 53L39 64L48 57L58 67" fill="none" stroke="#47745a" stroke-width="2"/></g><path d="M215 426v11m-5-5 5 5 5-5" fill="none" stroke="#b23c25" stroke-width="2"/><rect x="28" y="447" width="382" height="128" fill="#ded7c9"/><rect x="24" y="442" width="382" height="128" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="24" y="442" width="382" height="4" fill="#b23c25"/><text x="40" y="476" font-size="22" fill="#b23c25" font-weight="700" text-anchor="start">03</text><text x="92" y="477" font-size="24" fill="#151512" font-weight="700" text-anchor="start">逐页生成</text><text x="92" y="510" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">一次一个页面候选</text><text x="92" y="537" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">选择模型与参考图</text><g transform="translate(39,491) scale(.5)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><rect x="11" y="13" width="51" height="60" fill="#e8eee5"/><path d="M14 66L29 45L43 60L54 44L62 64" fill="none" stroke="#b23c25" stroke-width="2.5"/><circle cx="26" cy="29" r="8" fill="#b23c25"/><rect x="50" y="3" width="23" height="20" fill="#b23c25"/><text x="61.5" y="18" font-size="15" fill="#fcfbf7" font-weight="700" text-anchor="middle">1</text></g><path d="M215 576v11m-5-5 5 5 5-5" fill="none" stroke="#b23c25" stroke-width="2"/><rect x="28" y="597" width="382" height="128" fill="#ded7c9"/><rect x="24" y="592" width="382" height="128" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="24" y="592" width="382" height="4" fill="#47745a"/><text x="40" y="626" font-size="22" fill="#47745a" font-weight="700" text-anchor="start">04</text><text x="92" y="627" font-size="24" fill="#151512" font-weight="700" text-anchor="start">校对与成品</text><text x="92" y="660" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">人工采用 / 视觉检查</text><text x="92" y="687" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">单页输出与整章导出</text><g transform="translate(39,641) scale(.5)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><rect x="12" y="14" width="22" height="24" fill="#ebe6da" stroke="#151512" stroke-width="1.5"/><rect x="40" y="14" width="22" height="24" fill="#e8eee5" stroke="#151512" stroke-width="1.5"/><rect x="12" y="45" width="50" height="28" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><path d="M25 59L34 67L53 49" fill="none" stroke="#47745a" stroke-width="4"/></g><text x="24" y="766" font-size="18" fill="#151512" font-weight="600" text-anchor="start">本地：SQLite + 文件目录</text><text x="24" y="797" font-size="18" fill="#151512" font-weight="600" text-anchor="start">调用：配置的外部模型服务</text><path d="M24 820H406" fill="none" stroke="#d7d1c4" stroke-width="1"/><text x="24" y="851" font-size="18" fill="#151512" font-weight="700" text-anchor="start">逐页确认，不自动生成整章。</text><text x="24" y="881" font-size="15" fill="#b23c25" font-weight="400" text-anchor="start">可靠性加固中，当前限制见路线图。</text>
</svg>
