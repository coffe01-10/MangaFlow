<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-label="MangaFlow 漫画创作流程概览">
<title>MangaFlow 漫画创作流程概览</title>
<desc>原文与人物服装风格设定，进入剧本分页和分镜，再逐页生成一个候选；人工校对采用和视觉检查后输出。数据保存在本地，AI 调用使用外部供应商。这是业务流程示意，不是运行截图；任务可靠性、保存与质检仍有待修复问题。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style><defs><pattern id="paper-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.6" fill="#c9c2b3"/></pattern></defs><rect x="1" y="1" width="918" height="618" fill="#f4f1e9" stroke="#d7d1c4" stroke-width="1.5"/><rect x="2" y="2" width="916" height="616" fill="url(#paper-dots)"/><text x="32" y="36" font-size="14" fill="#66604f" font-weight="700" text-anchor="start">MANGAFLOW / PRODUCTION MAP</text><text x="32" y="80" font-size="36" fill="#151512" font-weight="700" text-anchor="start">从一段原文，到一页漫画。</text><text x="32" y="112" font-size="18" fill="#66604f" font-weight="400" text-anchor="start">AI 处理解析与绘图，你负责设定、校对与采用。</text><text x="888" y="36" font-size="14" fill="#66604f" font-weight="400" text-anchor="end">流程示意 · 非界面截图</text><rect x="36" y="149" width="196" height="280" fill="#ded7c9"/><rect x="32" y="144" width="196" height="280" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="32" y="144" width="196" height="4" fill="#151512"/><text x="48" y="176" font-size="20" fill="#151512" font-weight="700" text-anchor="start">01</text><g transform="translate(90,193)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><path d="M16 22H57 M16 34H57 M16 46H48 M16 58H54" fill="none" stroke="#66604f" stroke-width="3"/><rect x="49" y="66" width="14" height="8" fill="#151512"/></g><text x="48" y="320" font-size="25" fill="#151512" font-weight="700" text-anchor="start">原文与设定</text><text x="48" y="350" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">原作导入与来源追溯</text><text x="48" y="375" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">人物 / 服装 / 风格</text><text x="48" y="405" font-size="11" fill="#151512" font-weight="700" text-anchor="start">INPUT</text><path d="M234 282h12m-5-5 5 5-5 5" fill="none" stroke="#b23c25" stroke-width="2"/><rect x="256" y="149" width="196" height="280" fill="#ded7c9"/><rect x="252" y="144" width="196" height="280" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="252" y="144" width="196" height="4" fill="#47745a"/><text x="268" y="176" font-size="20" fill="#47745a" font-weight="700" text-anchor="start">02</text><g transform="translate(310,193)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><rect x="12" y="13" width="25" height="25" fill="#47745a"/><rect x="43" y="13" width="19" height="25" fill="#ebe6da" stroke="#151512" stroke-width="1.5"/><rect x="12" y="45" width="50" height="28" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><path d="M17 66L30 53L39 64L48 57L58 67" fill="none" stroke="#47745a" stroke-width="2"/></g><text x="268" y="320" font-size="25" fill="#151512" font-weight="700" text-anchor="start">剧本与分镜</text><text x="268" y="350" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">解析 / 分页 / 格位</text><text x="268" y="375" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">确认当前分镜版本</text><text x="268" y="405" font-size="11" fill="#47745a" font-weight="700" text-anchor="start">STORYBOARD</text><path d="M454 282h12m-5-5 5 5-5 5" fill="none" stroke="#b23c25" stroke-width="2"/><rect x="476" y="149" width="196" height="280" fill="#ded7c9"/><rect x="472" y="144" width="196" height="280" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="472" y="144" width="196" height="4" fill="#b23c25"/><text x="488" y="176" font-size="20" fill="#b23c25" font-weight="700" text-anchor="start">03</text><g transform="translate(530,193)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><rect x="11" y="13" width="51" height="60" fill="#e8eee5"/><path d="M14 66L29 45L43 60L54 44L62 64" fill="none" stroke="#b23c25" stroke-width="2.5"/><circle cx="26" cy="29" r="8" fill="#b23c25"/><rect x="50" y="3" width="23" height="20" fill="#b23c25"/><text x="61.5" y="18" font-size="15" fill="#fcfbf7" font-weight="700" text-anchor="middle">1</text></g><text x="488" y="320" font-size="25" fill="#151512" font-weight="700" text-anchor="start">逐页生成</text><text x="488" y="350" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">一次一个页面候选</text><text x="488" y="375" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">选择模型与参考图</text><text x="488" y="405" font-size="11" fill="#b23c25" font-weight="700" text-anchor="start">GENERATION</text><path d="M674 282h12m-5-5 5 5-5 5" fill="none" stroke="#b23c25" stroke-width="2"/><rect x="696" y="149" width="196" height="280" fill="#ded7c9"/><rect x="692" y="144" width="196" height="280" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><rect x="692" y="144" width="196" height="4" fill="#47745a"/><text x="708" y="176" font-size="20" fill="#47745a" font-weight="700" text-anchor="start">04</text><g transform="translate(750,193)"><rect x="4" y="4" width="66" height="80" fill="#f4f1e9" stroke="#151512" stroke-width="1.5"/><rect x="12" y="14" width="22" height="24" fill="#ebe6da" stroke="#151512" stroke-width="1.5"/><rect x="40" y="14" width="22" height="24" fill="#e8eee5" stroke="#151512" stroke-width="1.5"/><rect x="12" y="45" width="50" height="28" fill="#fcfbf7" stroke="#151512" stroke-width="1.5"/><path d="M25 59L34 67L53 49" fill="none" stroke="#47745a" stroke-width="4"/></g><text x="708" y="320" font-size="25" fill="#151512" font-weight="700" text-anchor="start">校对与成品</text><text x="708" y="350" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">人工采用 / 视觉检查</text><text x="708" y="375" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">单页输出与整章导出</text><text x="708" y="405" font-size="11" fill="#47745a" font-weight="700" text-anchor="start">HUMAN REVIEW</text><rect x="32" y="458" width="418" height="70" fill="#fcfbf7" stroke="#d7d1c4" stroke-width="1.5"/><text x="50" y="486" font-size="19" fill="#151512" font-weight="600" text-anchor="start">本地数据 / SQLite + 文件目录</text><text x="50" y="512" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">项目、版本、任务、素材与导出</text><rect x="470" y="458" width="418" height="70" fill="#fcfbf7" stroke="#d7d1c4" stroke-width="1.5"/><text x="488" y="486" font-size="19" fill="#151512" font-weight="600" text-anchor="start">外部模型 / API 与 Worker 调用</text><text x="488" y="512" font-size="16" fill="#66604f" font-weight="400" text-anchor="start">按配置向供应商发送所需文本与图片</text><text x="32" y="569" font-size="20" fill="#151512" font-weight="700" text-anchor="start">每页由你推进。不是无人值守的整章生成器。</text><text x="32" y="600" font-size="16" fill="#b23c25" font-weight="400" text-anchor="start">可靠性加固中 · 取消、保存与质检边界见路线图</text>
</svg>
