name: check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    # The repo is Windows-oriented (WPF desktop, PowerShell launchers, Windows
    # worker classes); the full gate only makes sense on a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The repo's own bootstrap: creates .venv, npm install, pip install,
      # .env from .env.example, migrations. Failures here are setup failures.
      - name: Bootstrap dependencies
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup-codex.ps1

      # Full gate: provider-neutrality, eslint, ruff (apps/api + tests),
      # pytest, vitest, production web build.
      - name: npm run check
        run: npm run check

  # Linux pytest layer: the default `tests/` collection contains POSIX-run
  # contract pins (desktop-script bridges, junction/POSIX re-anchor arms,
  # streaming-export pins via the cargo bridge) that skip or never compile
  # on the Windows-only job — this week's clean-master reds (#930, #879's
  # fixture, the #936 E0061) were all invisible to it. The Windows job
  # above stays the full gate; this one adds the POSIX half.
  linux-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt

      - name: pytest tests/
        run: python -m pytest tests/ -q
