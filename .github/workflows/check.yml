name: check

on:
  pull_request:
  push:
    branches: [master, diag/ci-isolation-evidence]

jobs:
  check:
    # The repo is Windows-oriented (WPF desktop, PowerShell launchers, Windows
    # worker classes); the full gate only makes sense on a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The repo's own bootstrap: creates .venv, npm install, pip install,
      # .env from .env.example, migrations. Failures here are setup failures.
      - name: Bootstrap dependencies
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup-codex.ps1

      # Full gate: provider-neutrality, eslint, ruff (apps/api + tests),
      # pytest, vitest, production web build.
      # DIAGNOSTIC BRANCH ONLY: full gate restored before merge to master.
      - name: Isolation tests only (diag branch)
        run: .venv\Scripts\python.exe -m pytest tests/test_e2e_isolation.py -q
