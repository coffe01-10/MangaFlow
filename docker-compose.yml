name: mangaflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangaflow
      POSTGRES_USER: mangaflow
      POSTGRES_PASSWORD: mangaflow
    ports:
      - "5432:5432"
    volumes:
      - mangaflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangaflow -d mangaflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - mangaflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mangaflow-postgres:
  mangaflow-redis:
